<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <div  th:fragment="content">

        <div th:replace="~{fragments/breadcrumbs :: breadcrumbs(${breadcrumbs})}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3 align-self-center">
            <h1 class="fs-5">Categories</h1>
        </div>

        <div >
            <form>
                <div class="row">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="col">
                        <input type="text" class="form-control" name="name" placeholder="Category Name">
                    </div>
                    <div class="col-2">
                        <button sec:authorize="hasAnyRole('MANAGER','ADMIN')" type="submit" class="btn btn-primary" th:hx-post="@{/categories}" th:hx-target="@{#category-list}">Add Category</button>
                    </div>
                </div>
            </form>
            <table class="table mt-3">
                <!-- <thead>
                    <tr>
                        <th>Category</th>
                    </tr>
                </thead> -->
                <tbody id="category-list" th:fragment="category-list">
                    <tr th:each="category : ${categories}">
                        <td th:text="${category.name}">Category Name</td>
                        <!-- <td>
                            <button th:hx-headers='|{"${_csrf.headerName}": "${_csrf.token}"}|' 
                                th:hx-delete="@{/categories/{id} (id=${category.categoryId}) }"
                                class="btn btn-light">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td> -->
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</html>
