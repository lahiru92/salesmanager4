<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="content" data-init="user">

    <div th:replace="~{fragments/breadcrumbs :: breadcrumbs(${breadcrumbs})}"></div>

    <h1 class="fs-5">Edit roles</h1>

    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <form th:hx-post="@{/users/{username}/roles (username=${username})}" hx-target="#content">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="col-md-6">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" th:value="${username}" disabled>
            </div>

            <div class="mb-3">
                <label class="form-label">Roles</label>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="admin" name="authorities" value="ADMIN" th:checked="${currentRoles.contains('ADMIN')}">
                    <label class="form-check-label" for="admin">Admin</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="hr" name="authorities" value="HR" th:checked="${currentRoles.contains('HR')}">
                    <label class="form-check-label" for="hr">HR</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="manager" name="authorities" value="MANAGER" th:checked="${currentRoles.contains('MANAGER')}">
                    <label class="form-check-label" for="manager">Manager</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="storekeeper" name="authorities" value="STOREKEEPER" th:checked="${currentRoles.contains('STOREKEEPER')}">
                    <label class="form-check-label" for="storekeeper">Storekeeper</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="clerk" name="authorities" value="CLERK" th:checked="${currentRoles.contains('CLERK')}">
                    <label class="form-check-label" for="clerk">Clerk</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="salesman" name="authorities" value="SALESMAN" th:checked="${currentRoles.contains('SALESMAN')}">
                    <label class="form-check-label" for="salesman">Salesman</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="cashier" name="authorities" value="CASHIER" th:checked="${currentRoles.contains('CASHIER')}">
                    <label class="form-check-label" for="cashier">Cashier</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a hx-get="/users" hx-target="#content" class="btn btn-outline-secondary">Cancel</a>

        </div>
    </form>

</div>
</html>
